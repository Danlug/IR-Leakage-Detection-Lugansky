<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thermal Report</title>
<style>
  :root { --bg:#f5f5f3; --card:#fff; --text:#1d1d1f; --muted:#6e6e73; --line:#e3e3e0; --accent:#e8541c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1c1c1e; --text:#eee; --muted:#999; --line:#2c2c2e; --accent:#ff6a2b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:19px; margin:0; flex:1 1 200px; }
  .langs button { border:1px solid var(--line); background:none; color:var(--text); padding:5px 10px; border-radius:6px; font:inherit; font-size:14px; cursor:pointer; }
  .langs button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  .msg { color:var(--muted); padding:40px 0; text-align:center; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; padding:0; text-align:start; color:inherit; font:inherit; }
  .card img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:#000; }
  .card div { padding:8px 10px; font-size:14px; } .card b { display:block; }
  .card p { margin:2px 0 0; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin:10px 0; }
  .btn, .seg label { border:1px solid var(--line); background:var(--card); color:var(--text); padding:8px 14px; border-radius:8px; font:inherit; cursor:pointer; }
  .btn:disabled { opacity:.35; cursor:default; }
  .seg { display:flex; } .seg input { display:none; }
  .seg label { border-radius:0; } .seg label:first-of-type { border-start-start-radius:8px; border-end-start-radius:8px; }
  .seg label:last-of-type { border-start-end-radius:8px; border-end-end-radius:8px; }
  .seg input:checked + label { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grow { flex:1 1 160px; display:flex; } .grow input { flex:1; accent-color:var(--accent); }
  .count { color:var(--muted); margin-inline-start:auto; }
  .stage { display:flex; justify-content:center; }
  #cv { max-width:100%; max-height:70vh; touch-action:none; border-radius:8px; background:#000; direction:ltr; }
  .comment { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; white-space:pre-wrap; }
  footer { text-align:center; padding:24px 16px; color:var(--muted); font-size:13px; }
  footer button { background:none; border:none; color:inherit; text-decoration:underline; cursor:pointer; font:inherit; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .modal > div { background:var(--card); color:var(--text); border-radius:12px; max-width:620px; max-height:90vh; overflow:auto; padding:20px; }
  .modal h2 { font-size:17px; margin:0 0 6px; } .modal p { margin:0 0 16px; font-size:15px; }
  .modal button { width:100%; padding:12px; border:none; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="modal" id="disclaimer">
  <div>
    <section lang="ru"><h2>Важно</h2><p id="dRu"></p></section>
    <section lang="en"><h2>Important</h2><p id="dEn"></p></section>
    <section lang="he" dir="rtl"><h2>חשוב</h2><p id="dHe"></p></section>
    <button id="accept">Понятно · I understand · הבנתי</button>
  </div>
</div>

<header>
  <h1 id="title" dir="auto"></h1>
  <div class="langs"><button data-l="ru">RU</button> <button data-l="en">EN</button> <button data-l="he">עב</button></div>
</header>

<main>
  <div class="msg" id="msg"></div>
  <div class="grid" id="gallery" hidden></div>
  <section id="pair" hidden>
    <div class="bar">
      <button class="btn" id="back"></button>
      <span class="count" id="count"></span>
    </div>
    <div class="bar">
      <div class="seg">
        <input type="radio" name="mode" id="mOpacity" value="opacity" checked><label for="mOpacity" data-t="opacity"></label>
        <input type="radio" name="mode" id="mSwipe" value="swipe"><label for="mSwipe" data-t="swipe"></label>
      </div>
      <div class="grow" id="rowOpacity"><input id="opacity" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="opacity"></div>
      <div class="grow" id="rowSwipe" hidden><input id="swipe" type="range" min="0" max="1" step="0.001" value="0.5" aria-label="swipe" dir="ltr"></div>
    </div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="bar"><button class="btn" id="prev"></button><button class="btn" id="next"></button></div>
    <div class="comment" id="comment" dir="auto" hidden></div>
  </section>
</main>
<footer><button id="showDisc"></button></footer>

<script src="align-core.js"></script>
<script src="viewer.js"></script>
<script src="report-core.js"></script>
<script>
const $ = id => document.getElementById(id);
const DISCLAIMER = {
  ru: 'Это приложение носит исключительно демонстрационный характер. Изображения получены тепловизором и совмещены со снимками обычной камеры; совмещение и цвета приблизительны. Приложение лишь указывает на возможное наличие протечки на основании температурных и визуальных данных. Оно не является экспертным заключением, диагнозом или гарантией наличия либо отсутствия протечки. Решения о ремонте и любых других действиях принимайте только после проверки квалифицированным специалистом. Автор не несёт ответственности за решения, принятые на основании этих изображений.',
  en: 'This application is for demonstration purposes only. The images were taken with a thermal camera and overlaid on photos from a regular camera; the alignment and colours are approximate. The application only indicates a possible leak based on temperature and visual data. It is not an expert opinion, a diagnosis, or a guarantee that a leak does or does not exist. Make decisions about repairs or any other action only after an inspection by a qualified professional. The author accepts no liability for decisions made on the basis of these images.',
  he: 'יישום זה נועד להמחשה בלבד. התמונות צולמו במצלמה תרמית ושולבו עם תמונות ממצלמה רגילה; השילוב והצבעים משוערים. היישום רק מצביע על אפשרות לקיומה של נזילה על סמך נתוני טמפרטורה ונתונים חזותיים. אין בו חוות דעת מומחה, אבחנה או התחייבות לקיומה או להיעדרה של נזילה. יש לקבל החלטות על תיקון או על כל פעולה אחרת רק לאחר בדיקה של איש מקצוע מוסמך. המחבר אינו נושא באחריות להחלטות שהתקבלו על סמך תמונות אלה.',
};
const TEXT = {
  ru: { report: 'Отчёт тепловизионного обследования', loading: 'Загрузка…', loadingN: 'Загрузка снимков: {0} из {1}', bad: 'Отчёт не найден или ссылка неполная. Проверьте, что ссылка скопирована целиком.',
        pair: 'Снимок {0}', of: '{0} из {1}', back: '← К галерее', prev: '← Предыдущий', next: 'Следующий →', opacity: 'Прозрачность', swipe: 'Шторка', disc: 'Предупреждение', empty: 'В отчёте пока нет снимков.' },
  en: { report: 'Thermal inspection report', loading: 'Loading…', loadingN: 'Loading images: {0} of {1}', bad: 'Report not found or the link is incomplete. Make sure the whole link was copied.',
        pair: 'Image {0}', of: '{0} of {1}', back: '← Gallery', prev: '← Previous', next: 'Next →', opacity: 'Opacity', swipe: 'Swipe', disc: 'Disclaimer', empty: 'This report has no images yet.' },
  he: { report: 'דוח בדיקה תרמית', loading: 'טוען…', loadingN: 'טוען תמונות: {0} מתוך {1}', bad: 'הדוח לא נמצא או שהקישור אינו שלם. ודאו שהקישור הועתק במלואו.',
        pair: 'תמונה {0}', of: '{0} מתוך {1}', back: '→ לגלריה', prev: '→ הקודם', next: 'הבא ←', opacity: 'שקיפות', swipe: 'השוואה', disc: 'הבהרה', empty: 'אין עדיין תמונות בדוח.' },
};
$('dRu').textContent = DISCLAIMER.ru; $('dEn').textContent = DISCLAIMER.en; $('dHe').textContent = DISCLAIMER.he;
$('accept').onclick = () => { $('disclaimer').hidden = true; };

let lang = (() => { try { const l = localStorage.getItem('irld-lang'); if (TEXT[l]) return l; } catch {}
  const n = (navigator.language || 'en').slice(0, 2); return n === 'iw' ? 'he' : TEXT[n] ? n : 'en'; })();
const t = (k, ...a) => TEXT[lang][k].replace(/\{(\d)\}/g, (_, i) => a[i]);
let report = null, photos = [], thermals = [], cur = -1, msgKey = 'loading', msgArgs = [];

function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  $('back').textContent = t('back'); $('prev').textContent = t('prev'); $('next').textContent = t('next'); $('showDisc').textContent = t('disc');
  $('title').textContent = report ? report.title : t('report');
  document.title = report ? report.title : t('report');
  if (msgKey) $('msg').textContent = t(msgKey, ...msgArgs);
  if (report) renderGallery();
  if (cur >= 0) $('count').textContent = t('of', cur + 1, report.pairs.length);
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('irld-lang', lang); } catch {} applyLang(); });
$('showDisc').onclick = () => { $('disclaimer').hidden = false; };
const say = (k, ...a) => { msgKey = k; msgArgs = a; $('msg').hidden = !k; if (k) $('msg').textContent = t(k, ...a); };

const ov = createOverlay($('cv'));
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  ov.mode = r.value; $('rowOpacity').hidden = r.value !== 'opacity'; $('rowSwipe').hidden = r.value !== 'swipe'; ov.draw();
});
$('opacity').oninput = () => { ov.opacity = +$('opacity').value; ov.draw(); };
$('swipe').oninput = () => { ov.swipe = +$('swipe').value; ov.draw(); };
ov.onSwipe = v => { $('swipe').value = v; };

const img = bytes => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })); });

function renderGallery() {
  $('gallery').innerHTML = '';
  report.pairs.forEach((p, i) => {
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = `<img alt=""><div><b></b><p dir="auto"></p></div>`;
    b.querySelector('img').src = photos[i].src; b.querySelector('b').textContent = t('pair', i + 1); b.querySelector('p').textContent = p.comment || '';
    b.onclick = () => { history.pushState({ i }, ''); openPair(i); };
    $('gallery').append(b);
  });
}

async function openPair(i) {
  cur = i; const p = report.pairs[i];
  $('gallery').hidden = true; $('pair').hidden = false; scrollTo(0, 0);
  $('count').textContent = t('of', i + 1, report.pairs.length);
  $('prev').disabled = i === 0; $('next').disabled = i === report.pairs.length - 1;
  $('comment').textContent = p.comment || ''; $('comment').hidden = !p.comment;
  if (!thermals[i]) { ov.setImages(photos[i], null, null); thermals[i] = await img(await fetchFile(link.id, link.key, `${p.id}-${p.v}-t.enc`)); }
  if (cur === i) ov.setImages(photos[i], thermals[i], p.H || defaultH(thermals[i].naturalWidth / thermals[i].naturalHeight, photos[i].naturalWidth / photos[i].naturalHeight));
}
function showGallery() { cur = -1; $('pair').hidden = true; $('gallery').hidden = false; }
const go = d => { const i = cur + d; if (cur >= 0 && i >= 0 && i < report.pairs.length) { history.replaceState({ i }, ''); openPair(i); } };
$('prev').onclick = () => go(-1); $('next').onclick = () => go(1);
$('back').onclick = () => history.back();
addEventListener('popstate', e => { if (e.state && e.state.i >= 0) openPair(e.state.i); else showGallery(); });
addEventListener('keydown', e => {
  if (cur < 0) return;
  const rtl = lang === 'he';
  if (e.key === 'ArrowLeft') go(rtl ? 1 : -1); if (e.key === 'ArrowRight') go(rtl ? -1 : 1); if (e.key === 'Escape') history.back();
});

const link = parseLink(location.hash);
applyLang();
(async () => {
  if (!link) return say('bad');
  try {
    report = await fetchReport(link.id, link.key);
    if (!report.pairs.length) { applyLang(); return say('empty'); }
    for (const [i, p] of report.pairs.entries()) {
      say('loadingN', i + 1, report.pairs.length);
      photos[i] = await img(await fetchFile(link.id, link.key, `${p.id}-${p.v}-p.enc`));
    }
    say(null); history.replaceState({}, ''); applyLang(); $('gallery').hidden = false;
  } catch (e) { console.error(e); say('bad'); }
})();
</script>
</body>
</html>
